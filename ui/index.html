<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lobby</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lobby.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="titlebar" data-tauri-drag-region>
        <div class="lights">
          <button class="light close" data-action="win-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg></button>
          <button class="light min" data-action="win-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M3 6h6"/></svg></button>
          <button class="light max" data-action="win-max" aria-label="Zoom"><svg viewBox="0 0 12 12"><path d="M6 3v6M3 6h6"/></svg></button>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a data-page="search"><i data-icon="search"></i><span>Search</span></a>
        <a data-page="home"><i data-icon="home"></i><span>Home</span></a>
        <div class="nav-section">Library</div>
        <a data-page="games"><i data-icon="gamepad"></i><span>Games</span><b class="count" id="c-games"></b></a>
        <a data-page="installed"><i data-icon="drive"></i><span>Installed</span><b class="count" id="c-installed"></b></a>
        <a data-page="favorites"><i data-icon="star"></i><span>Favorites</span><b class="count" id="c-favorites"></b></a>
        <a data-page="recent"><i data-icon="clock"></i><span>Recently Played</span></a>
        <a data-page="software" id="nav-software"><i data-icon="app"></i><span>Software</span><b class="count" id="c-software"></b></a>
        <div class="nav-section">Steam</div>
        <a data-page="accounts"><i data-icon="people"></i><span>Accounts</span><b class="count" id="c-accounts"></b></a>
        <a data-page="settings"><i data-icon="gear"></i><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="round-btn" data-action="refresh" id="refresh-btn" aria-label="Reload library" title="Reload library (Ctrl+R)"><i data-icon="refresh"></i></button>
        <button class="me" id="me" data-action="picker" title="Switch account"></button>
      </div>
    </aside>
    <main class="content" id="content">
      <div class="content-drag" data-tauri-drag-region></div>
      <div id="banner"></div>
      <div id="page"></div>
    </main>
  </div>
  <div class="sheet-backdrop" id="sheet" hidden></div>
  <script src="app.js"></script>
</body>
</html>
